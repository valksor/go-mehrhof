packages:
  - path: "github.com/valksor/kvelmo/internal/socket"
    output_path: "web/src/types/socket.ts"
    frontmatter: |
      import type { ContextItem, PhaseMetrics } from './shared'
    # Type mappings for Go types that don't translate well
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
      worker.Pool: "unknown"
      storage.Review: "unknown"
      # Cross-package struct types resolved to hand-written interfaces
      conductor.ContextItem: "ContextItem"
      conductor.PhaseMetrics: "PhaseMetrics"
      git.FileStatus: "FileStatus"
    # Only include API-relevant files, skip internal ones
    include_files:
      - "global.go"
      - "global_projects.go"
      - "worktree.go"
      - "worktree_types.go"
      - "worktree_checkpoint.go"
      - "memory.go"
      - "chat.go"
      - "protocol.go"
  - path: "github.com/valksor/kvelmo/internal/conductor"
    output_path: "web/src/types/conductor.ts"
    type_mappings:
      time.Time: "string"
      time.Duration: "number"
      json.RawMessage: "unknown"
      conductor.ContextResolver: "unknown"
      ContextResolver: "unknown"
    # Only export types needed by the web frontend
    include_files:
      - "conductor_fork.go"
      - "context.go"
      - "state.go"
      - "router.go"
